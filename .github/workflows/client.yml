# Vouch Compute desktop app: lint, tests (incl. sandbox escape tests and the mock-server integration test), release
# hygiene, native runtime feature builds, and unsigned bundles for Linux (AppImage + deb), macOS (aarch64 .app, DMG
# and updater archive, the forms a release ships) and Windows (NSIS). Signing and notarization run only in
# client-release.yml (tags, protected environment). This workflow has no secrets and never runs on self-hosted runners.
#
# Minutes budget (T-156, reports/CI minutes budget.md). This repository is public, so GitHub's standard hosted runners
# use no paid minutes; the heavy macOS and Windows gates still run only where they are needed:
# * every PR and push to main (path-filtered): `quick` (secret scan, cargo/npm audit, JS tests), then `rust` (Linux:
#   clippy -D warnings, workspace tests, release feature set, release-hygiene markers) and `onnx-cpu` (each desktop
#   OS's pinned ONNX Runtime pack runs the bge-m3 stand-in in the sandboxed runner on the CPU: Linux x64, macOS arm64,
#   Windows x64);
# * push to main, the weekly run and manual runs add `native` (whisper + onnx runtime build);
# * the weekly run and manual runs add `bundle` (Linux AppImage + deb);
# * a manual run with platforms=windows (or all, which adds macOS) also runs the full gate and the bundle there. Run
#   platforms=windows before cutting a client-v* tag; the Windows sandbox-isolation tests (LPAC / AppContainer) only
#   run there. macOS is exercised by the release workflow itself.
name: client

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "proto/**"
      - ".github/workflows/client.yml"
      - "!**/*.md"
  pull_request:
    paths:
      - "client/**"
      - "proto/**"
      - ".github/workflows/client.yml"
      - "!**/*.md"
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
    inputs:
      platforms:
        description: "linux (default), windows (adds Windows, 2x minutes) or all (adds Windows and macOS, 2x and 10x)"
        type: choice
        options: [linux, windows, all]
        default: linux

permissions:
  contents: read

concurrency:
  group: client-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.98.1"
  LINUX_PACKAGES: >-
    libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev libssl-dev patchelf cmake clang
    libclang-dev

jobs:
  # Cheap gates first: secrets, known-vulnerable dependencies (RustSec advisory database, the Tauri CLI's npm tree)
  # and the plain-JS tests. No Rust compilation.
  quick:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Secret scan (gitleaks 8.30.1, binary pinned by sha256)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir . --no-banner --redact
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/pool-app/package-lock.json
      - name: App money display (decimal strings, no floats)
        run: node client/pool-app/tests/usd.test.js
      - name: App reliability card (server-provided object only)
        run: node client/pool-app/tests/reliability.test.js
      - name: App rendering (hero status, escaping, backend labels incl. Metal)
        run: node client/pool-app/tests/render.test.js
      - name: App languages (keys, ICU arguments, glossary, every locale)
        run: node client/pool-app/tests/i18n.test.js
      - name: App languages rendered (no raw keys or leftovers, lang and dir per locale)
        run: node client/pool-app/tests/i18n-render.test.js
      - name: Homebrew cask (updater output, app name and minimum macOS against the Tauri config)
        run: node client/pool-app/tests/homebrew-cask.test.js
      - name: Runtime packs (bundle configs, pins and install paths agree)
        run: node client/pool-app/tests/runtime-packs.test.js
      - name: Release bundle check refuses changed pack bytes (self-test, incl. the .deb)
        run: node client/pool-app/tests/release-pack-check.test.js
      - name: cargo audit
        working-directory: client
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - name: npm audit (Tauri CLI)
        working-directory: client/pool-app
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=high

  # Linux gate: one job, so clippy, tests and the release-hygiene builds share one toolchain install, one package
  # install and one cache. Release hygiene, on every change:
  # * a release-signing build (POOL_RELEASE=1) with dev-trust must fail to compile;
  # * the release feature set builds, and its binaries pass the marker check (no dev trust roots, no dev reference
  #   backend, build info dev-trust=no);
  # * the checker itself refuses a dev-trust binary, so a broken checker cannot pass silently.
  rust:
    name: rust (clippy, tests, release hygiene)
    needs: quick
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - name: Linux system packages
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_PACKAGES
      # The cache is written by runs on main only; pull requests restore it, so branch runs do not fill the 10 GB cap.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: client
          shared-key: client-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (protocol, signing, replay, offer state machine, governor, bundles, sandbox, mock server)
        run: cargo test --workspace -- --nocapture
      - name: Release feature set compiles without dev trust
        run: |
          cargo check -p pool-core --no-default-features --features nvml
          cargo check -p pool-runner --no-default-features --features candle,onnx
      - name: Release decoding rules (pool-proto without dev-trust)
        run: cargo test -p pool-proto --no-default-features
      - name: A release build with dev-trust fails (compile_error! guard)
        run: bash ci/release-guard.sh
      - name: Build the release agent binaries (POOL_RELEASE=1, no dev-trust)
        env:
          POOL_RELEASE: "1"
        run: |
          cargo build --release -p pool-core --bin pool-core --no-default-features --features nvml,release
          cargo build --release -p pool-runner --bin pool-runner --no-default-features --features candle,onnx
          mkdir -p "$RUNNER_TEMP/release-bins"
          cp target/release/pool-core target/release/pool-runner "$RUNNER_TEMP/release-bins/"
      - name: Marker check passes on the release binaries
        run: bash ci/release-marker-check.sh "$RUNNER_TEMP/release-bins"
      - name: Marker check refuses a dev-trust binary
        run: |
          cargo build -p pool-runner --bin pool-runner
          if bash ci/release-marker-check.sh target/debug/pool-runner; then echo "the checker passed a dev-trust binary"; exit 1; fi

  # The desktop ONNX Runtime packs on their own OS (T-215, T-216): fetch this target's pack from the source pinned in
  # crates/pool-runner/packs.json (fails on any SHA-256 mismatch), then run the bge-m3 stand-in tests (tiny XLM-R
  # graph with external weights, tests/fixtures/xlmr-tiny) in the real runner inside the OS sandbox, CPU only, against
  # the reference worker's embeddings. POOL_REQUIRE_ORT_PACK=1 turns "no pack" into a failure. No real weights, no GPU.
  # macOS runs it twice: as cargo builds the runner, and ad-hoc signed with the hardened runtime as the app bundle
  # signs it (library validation then applies to the pinned dylib).
  onnx-cpu:
    name: onnx-cpu ${{ matrix.name }}
    needs: quick
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-22.04 }
          - { name: macos-aarch64, os: macos-latest }
          - { name: windows-x86_64, os: windows-latest }
    defaults:
      run:
        working-directory: client
        shell: bash
    env:
      POOL_REQUIRE_ORT_PACK: "1"
    steps:
      - name: Check out with LF line endings
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: client
          shared-key: client-onnx-${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Runtime pack for this OS (pinned source, SHA-256 checked)
        run: |
          node pool-app/scripts/runtime-packs.mjs
          node pool-app/scripts/runtime-packs.mjs --check
      - name: bge-m3 stand-in in the sandboxed runner, CPU
        run: cargo test -p pool-runner --features onnx --test onnx_xlmr -- --nocapture
      - name: Same, runner ad-hoc signed with the hardened runtime (as in the app bundle)
        if: runner.os == 'macOS'
        run: |
          cargo test -p pool-runner --features onnx --test onnx_xlmr --no-run
          codesign --force --sign - --options runtime target/debug/pool-runner
          codesign --display --verbose=2 target/debug/pool-runner 2>&1 | grep -E 'flags|Signature'
          cargo test -p pool-runner --features onnx --test onnx_xlmr -- --nocapture
      # The Mac path (T-219): the real agent links as a capped device, runs the probation benchmark and a job for the
      # bge-m3 stand-in on this pack (CPU), and keeps the speed it measured for the app. macOS and Linux (CPU packs).
      - name: Agent end to end on the CPU pack (benchmark, job, measured speed)
        if: runner.os != 'Windows'
        run: cargo test -p pool-core --test onnx_cpu_path -- --nocapture
      # Windows: each job's sandbox can read only its own model dir (per-job AppContainer grants, T-218 review)
      - name: Windows sandbox grants are per job
        if: runner.os == 'Windows'
        run: |
          cargo test -p pool-sandbox -- --nocapture
          cargo test -p pool-core --test sandbox_isolation -- --nocapture
      - name: Sandbox denials (macOS, on failure)
        if: failure() && runner.os == 'macOS'
        run: log show --last 15m --style compact --predicate 'sender == "Sandbox"' | grep -iE 'pool-runner' | tail -n 80 || true

  # Heavy native runtime features (whisper.cpp + ONNX Runtime): main, weekly and manual runs only.
  native:
    name: native runtimes (whisper, onnx)
    needs: rust
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Linux system packages
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_PACKAGES
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: client
          shared-key: client-linux-native
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Native runtime features build (whisper,onnx)
        run: cargo build -p pool-runner --features whisper,onnx

  # Unsigned bundles. Linux: weekly and manual runs. Windows: manual runs with platforms=windows or all; macOS: platforms=all only (they also
  # run the full gate, because the Linux `rust` job does not cover Windows-only code such as the sandbox).
  # macOS is arm64 (`macos-latest`); the pinned `macos-14` image is no longer offered.
  bundle:
    name: bundle ${{ matrix.name }}
    needs: rust
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      # Matrix contexts cannot use `env`, hence the inline JSON.
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.platforms == 'all' && '[{"name":"linux-x86_64","os":"ubuntu-22.04","bundles":"appimage,deb","native_features":"whisper,onnx","timeout":60},{"name":"macos-aarch64","os":"macos-latest","bundles":"app,dmg","native_features":"whisper,onnx","timeout":60},{"name":"windows-x86_64","os":"windows-latest","bundles":"nsis","native_features":"onnx","timeout":60}]' || github.event_name == 'workflow_dispatch' && inputs.platforms == 'windows' && '[{"name":"linux-x86_64","os":"ubuntu-22.04","bundles":"appimage,deb","native_features":"whisper,onnx","timeout":60},{"name":"windows-x86_64","os":"windows-latest","bundles":"nsis","native_features":"onnx","timeout":60}]' || '[{"name":"linux-x86_64","os":"ubuntu-22.04","bundles":"appimage,deb","native_features":"whisper,onnx","timeout":60}]') }}
    defaults:
      run:
        working-directory: client
    steps:
      # Keep LF: the sources and test fixtures are LF-only.
      - name: Check out with LF line endings
        working-directory: .
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - name: Linux system packages
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_PACKAGES

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: client
          shared-key: client-bundle-${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/pool-app/package-lock.json

      - name: Runtime pack (bundle resources; pinned source, SHA-256 checked)
        run: node pool-app/scripts/runtime-packs.mjs

      # Linux already passed these in the `rust` and `native` jobs.
      - name: Clippy (deny warnings)
        if: runner.os != 'Linux'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests (protocol, signing, replay, offer state machine, governor, bundles, sandbox, mock server)
        if: runner.os != 'Linux'
        run: cargo test --workspace -- --nocapture

      - name: Sandbox isolation (Windows LPAC and the GPU-job AppContainer)
        if: runner.os == 'Windows'
        run: cargo test -p pool-core --test sandbox_isolation -- --nocapture

      - name: Native runtime features build (${{ matrix.native_features }})
        if: runner.os != 'Linux'
        run: cargo build -p pool-runner --features ${{ matrix.native_features }}

      - name: Release feature set compiles without dev trust
        if: runner.os != 'Linux'
        run: |
          cargo check -p pool-core --no-default-features --features nvml
          cargo check -p pool-runner --no-default-features --features candle,onnx

      - name: Release decoding rules (pool-proto without dev-trust)
        if: runner.os != 'Linux'
        run: cargo test -p pool-proto --no-default-features

      # macOS (manual platforms=all runs only): the Metal build and the macOS sandbox checks with the runner's
      # `metal` feature (the GPU half skips itself on a runner VM without a usable Metal device).
      - name: macOS Metal build (clippy, sandbox tests with the GPU rules)
        if: runner.os == 'macOS'
        run: |
          cargo clippy -p pool-runner --features metal --all-targets -- -D warnings
          cargo test -p pool-runner --features metal --test sandbox_macos -- --nocapture

      - name: Tauri CLI
        working-directory: client/pool-app
        run: npm ci --no-audit --no-fund

      # Throwaway key, so the bundle step signs the updater archives (.sig) as a release does. It never enters
      # GITHUB_ENV (whose values the step headers print) and is masked line by line in case anything echoes it; the
      # bundle step reads it from the runner's temp dir.
      - name: Ephemeral updater key (CI bundles are unsigned dev builds, dev update channel)
        working-directory: client/pool-app
        shell: bash
        run: |
          npx tauri signer generate --ci -w "$RUNNER_TEMP/updater.key" -f > /dev/null
          test -s "$RUNNER_TEMP/updater.key" || { echo "no updater key generated"; exit 1; }
          tr -d '\r' < "$RUNNER_TEMP/updater.key" | while IFS= read -r line || [ -n "$line" ]; do
            if [ -n "$line" ]; then echo "::add-mask::$line"; fi
          done

      # Same ad-hoc signature as a release macOS build (client-release.yml), so this run shows what signing does to
      # the bundled runtime pack before a tag (CR-T215-01 follow-up).
      - name: macOS ad-hoc signature (as the release)
        if: runner.os == 'macOS'
        working-directory: client/pool-app
        run: echo '{"bundle":{"macOS":{"signingIdentity":"-"}}}' > src-tauri/tauri.signing.conf.json

      # `tauri build` runs scripts/sidecars.mjs, which fetches the target's pinned runtime pack
      # (scripts/runtime-packs.mjs, from nuget.org) and fails the build on any hash mismatch.
      - name: Bundle (${{ matrix.bundles }})
        working-directory: client/pool-app
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        shell: bash
        run: |
          TAURI_SIGNING_PRIVATE_KEY="$(tr -d '\r' < "$RUNNER_TEMP/updater.key")"
          export TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD=""
          if [ "$RUNNER_OS" = macOS ]; then
            npx tauri build --config src-tauri/tauri.signing.conf.json --bundles ${{ matrix.bundles }}
          else
            npx tauri build --bundles ${{ matrix.bundles }}
          fi

      - name: Runtime pack in the packaged app, after signing (pinned bytes in every packaged form)
        shell: bash
        env:
          RELEASE_PACK_REQUIRE: ${{ runner.os == 'macOS' && 'app,dmg,updater' || runner.os == 'Linux' && 'deb,appimage' || '' }}
        run: bash ci/release-pack-check.sh ${{ matrix.name }} target/release/bundle

      - name: Upload bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vouch-compute-${{ matrix.name }}-unsigned
          if-no-files-found: error
          retention-days: 7
          path: |
            client/target/release/bundle/appimage/*.AppImage
            client/target/release/bundle/deb/*.deb
            client/target/release/bundle/dmg/*.dmg
            client/target/release/bundle/macos/*.app.tar.gz
            client/target/release/bundle/nsis/*.exe
            client/target/release/bundle/**/*.sig

  # Weekly only: the full git history is scanned for secrets (the per-change scan covers the working tree).
  history-scan:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Secret scan over history (gitleaks 8.30.1, binary pinned by sha256)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --no-banner --redact
