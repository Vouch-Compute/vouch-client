# Vouch Compute desktop app: lint, tests (incl. sandbox escape tests and the mock-server integration test), native
# runtime feature builds, and unsigned bundles for Linux (AppImage + deb), macOS (aarch64 DMG) and Windows (NSIS).
# Signing and notarization run only in client-release.yml (tags, protected environment). This workflow has no secrets
# and never runs on self-hosted runners.
name: client

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.98.1"

jobs:
  # Release hygiene, on every change:
  # * a release-signing build (POOL_RELEASE=1) with dev-trust must fail to compile;
  # * the release feature set builds, and its binaries pass the marker check (no dev trust roots, no dev reference
  #   backend, build info dev-trust=no);
  # * the checker itself refuses a dev-trust binary, so a broken checker cannot pass silently.
  release-hygiene:
    name: release-hygiene
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client
      - name: A release build with dev-trust fails (compile_error! guard)
        run: bash ci/release-guard.sh
      - name: Build the release agent binaries (POOL_RELEASE=1, no dev-trust)
        env:
          POOL_RELEASE: "1"
        run: |
          cargo build --release -p pool-core --bin pool-core --no-default-features --features nvml,release
          cargo build --release -p pool-runner --bin pool-runner --no-default-features --features candle
          mkdir -p "$RUNNER_TEMP/release-bins"
          cp target/release/pool-core target/release/pool-runner "$RUNNER_TEMP/release-bins/"
      - name: Marker check passes on the release binaries
        run: bash ci/release-marker-check.sh "$RUNNER_TEMP/release-bins"
      - name: Marker check refuses a dev-trust binary
        run: |
          cargo build -p pool-runner --bin pool-runner
          if bash ci/release-marker-check.sh target/debug/pool-runner; then echo "the checker passed a dev-trust binary"; exit 1; fi

  # Known-vulnerable dependencies (RustSec advisory database) and the Tauri CLI's npm tree.
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: cargo audit
        working-directory: client
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - name: npm audit (Tauri CLI)
        working-directory: client/pool-app
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=high

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # macOS runs only when the workflow is started by hand (Actions > client > Run workflow): macOS runner minutes
      # are billed at a multiple of Linux minutes for private repositories, and the pinned `macos-14` image is no
      # longer offered ("configuration 'macos-14-arm64-us-default' is not supported"). `macos-latest` is arm64.
      # Push and pull-request runs build Linux and Windows. Matrix contexts cannot use `env`, hence the inline JSON.
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '[{"name":"linux-x86_64","os":"ubuntu-22.04","bundles":"appimage,deb","native_features":"whisper,onnx"},{"name":"macos-aarch64","os":"macos-latest","bundles":"dmg","native_features":"whisper,onnx"},{"name":"windows-x86_64","os":"windows-latest","bundles":"nsis","native_features":"onnx"}]' || '[{"name":"linux-x86_64","os":"ubuntu-22.04","bundles":"appimage,deb","native_features":"whisper,onnx"},{"name":"windows-x86_64","os":"windows-latest","bundles":"nsis","native_features":"onnx"}]') }}
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - name: Linux system packages
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libgtk-3-dev libssl-dev patchelf cmake clang libclang-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client

      - uses: actions/setup-node@v4
        if: runner.os == 'Windows'
        with:
          node-version: 22
      - name: GPU pack (bundle resources for the Windows build)
        if: runner.os == 'Windows'
        run: node pool-app/scripts/gpu-pack.mjs

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests (protocol, signing, replay, offer state machine, governor, bundles, sandbox, mock server)
        run: cargo test --workspace -- --nocapture

      - name: Sandbox isolation (Windows LPAC and the GPU-job AppContainer)
        if: runner.os == 'Windows'
        run: cargo test -p pool-core --test sandbox_isolation -- --nocapture

      - name: Native runtime features build (${{ matrix.native_features }})
        run: cargo build -p pool-runner --features ${{ matrix.native_features }}

      - name: Release feature set compiles without dev trust
        run: |
          cargo check -p pool-core --no-default-features --features nvml
          cargo check -p pool-runner --no-default-features --features candle

      - name: Release decoding rules (pool-proto without dev-trust)
        run: cargo test -p pool-proto --no-default-features

      # macOS (manual runs only, see the matrix): the Metal build and the macOS sandbox checks. The workspace tests
      # above already run tests/sandbox_macos.rs without Metal; this adds clippy and the same tests with the
      # runner's `metal` feature (the GPU half skips itself on a runner VM without a usable Metal device).
      - name: macOS Metal build (clippy, sandbox tests with the GPU rules)
        if: runner.os == 'macOS'
        run: |
          cargo clippy -p pool-runner --features metal --all-targets -- -D warnings
          cargo test -p pool-runner --features metal --test sandbox_macos -- --nocapture

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: App money display (decimal strings, no floats)
        run: node pool-app/tests/usd.test.js

      - name: App reliability card (server-provided object only)
        run: node pool-app/tests/reliability.test.js

      - name: App rendering (hero status, escaping, backend labels incl. Metal)
        run: node pool-app/tests/render.test.js

      - name: Tauri CLI
        working-directory: client/pool-app
        run: npm ci --no-audit --no-fund

      - name: Ephemeral updater key (CI bundles are unsigned dev builds, dev update channel)
        working-directory: client/pool-app
        shell: bash
        run: |
          npx tauri signer generate --ci -w "$RUNNER_TEMP/updater.key" -f
          # Multi-line value for GITHUB_ENV: a random delimiter that cannot occur in the key, CRs stripped, and the
          # value always ends with a newline before the closing delimiter (the key file has no trailing newline).
          delim="KEY_$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          key="$(tr -d '\r' < "$RUNNER_TEMP/updater.key")"
          case "$key" in *"$delim"*) echo "delimiter collision"; exit 1;; esac
          {
            printf '%s<<%s\n' TAURI_SIGNING_PRIVATE_KEY "$delim"
            printf '%s\n' "$key"
            printf '%s\n' "$delim"
            printf 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD=\n'
          } >> "$GITHUB_ENV"

      # Windows: `tauri build` runs scripts/sidecars.mjs, which fetches the pinned GPU pack (scripts/gpu-pack.mjs,
      # from nuget.org) and fails the build on any hash mismatch.
      - name: Bundle (${{ matrix.bundles }})
        working-directory: client/pool-app
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: vouch-compute-${{ matrix.name }}-unsigned
          if-no-files-found: error
          path: |
            client/target/release/bundle/appimage/*.AppImage
            client/target/release/bundle/deb/*.deb
            client/target/release/bundle/dmg/*.dmg
            client/target/release/bundle/nsis/*.exe
            client/target/release/bundle/**/*.sig
