<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Vouch Compute</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="i18n.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <a class="skip" href="#main" data-i18n="shell.skip">Skip to content</a>
    <div class="app" id="app">
      <aside class="sidebar">
        <div class="brand">
          <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><path d="M38.64 14.23A22 22 0 1 0 46.8 46.93" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.5 27L29.5 42L55.5 9" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <svg class="brand-wordmark" xmlns="http://www.w3.org/2000/svg" focusable="false" viewBox="0 0 396 64" role="img" aria-label="Vouch Compute"><title>Vouch Compute</title><g transform="translate(2 0)"><g transform="translate(0 0)" fill="none" stroke="currentColor" stroke-width="6.6" stroke-linecap="round" stroke-linejoin="round"><path transform="translate(3.3 0)" d="M0 11.3L13 44.7L26 11.3"/><path transform="translate(36.5 0)" d="M10.7 23.3A10.700000000000001 10.700000000000001 0 1 1 10.7 44.7A10.700000000000001 10.700000000000001 0 1 1 10.7 23.3Z"/><path transform="translate(69.1 0)" d="M0 23.3V34A9.700000000000001 9.700000000000001 0 0 0 19.400000000000002 34M19.400000000000002 23.3V44.7"/><path transform="translate(98.7 0)" d="M17.86 26.05A10.700000000000001 10.700000000000001 0 1 0 17.86 41.95"/><path transform="translate(129.3 0)" d="M0 11.3V44.7M0 34A9.700000000000001 9.700000000000001 0 0 1 19.400000000000002 34V44.7"/></g><g transform="translate(165 0)" fill="none" stroke="currentColor" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"><path transform="translate(2.3 0)" d="M30 15.27A17.700000000000003 17.700000000000003 0 1 0 30 40.73"/><path transform="translate(42.7 0)" d="M11.7 22.3A11.700000000000001 11.700000000000001 0 1 1 11.7 45.7A11.700000000000001 11.700000000000001 0 1 1 11.7 22.3Z"/><path transform="translate(76.1 0)" d="M0 22.3V45.7M0 30.150000000000002A7.8500000000000005 7.8500000000000005 0 0 1 15.700000000000001 30.150000000000002V45.7M15.700000000000001 30.150000000000002A7.8500000000000005 7.8500000000000005 0 0 1 31.400000000000002 30.150000000000002V45.7"/><path transform="translate(117.5 0)" d="M0 22.3V57.7M11.7 22.3A11.700000000000001 11.700000000000001 0 1 1 11.7 45.7A11.700000000000001 11.700000000000001 0 1 1 11.7 22.3Z"/><path transform="translate(150.9 0)" d="M0 22.3V34A10.700000000000001 10.700000000000001 0 0 0 21.400000000000002 34M21.400000000000002 22.3V45.7"/><path transform="translate(181.3 0)" d="M4 14.3V40.7Q4 45.7 9 45.7H11M0 22.3H11"/><path transform="translate(201.3 0)" d="M0 34H23.400000000000002A11.700000000000001 11.700000000000001 0 1 0 19.83 42.42"/></g></g></svg>
        </div>
        <p class="side-tagline" data-i18n="shell.tagline">Verified AI compute from spare machines.</p>
        <nav class="nav" id="tabs" aria-label="Main" data-i18n-attr="aria-label:shell.navLabel" hidden>
          <button type="button" data-view="home"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3.5 10.5 12 3.5l8.5 7V19a1.5 1.5 0 0 1-1.5 1.5h-4v-6h-6v6H5A1.5 1.5 0 0 1 3.5 19z"/></svg><span data-i18n="nav.home">Home</span></button>
          <button type="button" data-view="earnings"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 7a2 2 0 0 1 2-2h11v3M4 7v11a2 2 0 0 0 2 2h13a1 1 0 0 0 1-1v-9a1 1 0 0 0-1-1H6a2 2 0 0 1-2-2zM16 14h.5"/></svg><span data-i18n="nav.earnings">Earnings</span></button>
          <button type="button" data-view="device"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3.5 5.5a1 1 0 0 1 1-1h15a1 1 0 0 1 1 1V15a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1zM8.5 20h7M12 16v4"/></svg><span data-i18n="nav.device">Device</span></button>
          <button type="button" data-view="settings"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 7h10M18 7h2M4 17h4M12 17h8M16 5a2 2 0 1 1 0 4 2 2 0 0 1 0-4zM10 15a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"/></svg><span data-i18n="nav.settings">Settings</span></button>
        </nav>
        <div class="side-foot">
          <div class="side-status" id="side-status" data-tone="muted"><span class="side-dot" aria-hidden="true"></span><span class="side-status-text" data-i18n="shell.starting">Starting…</span></div>
          <div class="side-row">
            <span class="badge badge-dev" id="dev-badge" title="Development build: dev keys, dev update channel, test network. Not a release." data-i18n="common.devBuild" data-i18n-attr="title:common.devBuildTitle">DEV BUILD</span>
            <span class="spacer"></span>
            <button type="button" class="icon-btn" id="theme-toggle" aria-label="Switch colour theme" title="Switch theme" data-i18n-attr="aria-label:shell.themeToggle;title:shell.themeToggleTitle">
              <svg class="i i-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19.5 14.5A7.5 7.5 0 0 1 9.5 4.5a7.5 7.5 0 1 0 10 10z"/></svg>
              <svg class="i i-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2.5v2M12 19.5v2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M2.5 12h2M19.5 12h2M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
            </button>
          </div>
        </div>
      </aside>
      <div class="content">
        <div class="pilot" id="pilot" role="note" hidden></div>
        <main id="main" tabindex="-1"></main>
      </div>
      <div class="toast" id="toast" aria-hidden="true"></div>
      <div class="sr-only" aria-live="polite" id="live"></div>
    </div>
    <noscript>Vouch Compute needs JavaScript enabled in its window.</noscript>
  </body>
</html>
