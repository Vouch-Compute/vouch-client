[package]
name = "pool-sandbox"
description = "Launches pool-runner inside the OS sandbox (AppContainer + Job Object / user+net namespaces / sandbox-exec). Kept out of the runner binary so the runner links nothing it does not need."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Dev builds only: pass POOL_DEV_TRUST_ROOTS through to the sandboxed runner.
dev-trust = []

[dependencies]
serde.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
