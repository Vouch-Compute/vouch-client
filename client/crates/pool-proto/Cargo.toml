[package]
name = "pool-proto"
description = "Node protocol messages (proto/node.proto) and signed objects (COSE_Sign1 over deterministic CBOR, proto/signed-objects.cddl)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Allows trust roots to be overridden at runtime (POOL_DEV_TRUST_ROOTS). Dev/test builds only;
# production release builds are made without it.
dev-trust = []
# Release-signing configuration (also `POOL_RELEASE=1`): refuses to compile together with `dev-trust`.
release = []
testkit = []

[dependencies]
prost.workspace = true
ciborium.workspace = true
p256.workspace = true
sha2.workspace = true
base64.workspace = true
thiserror.workspace = true
rand_core.workspace = true
zeroize = "1"
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
prost-build.workspace = true
protoc-bin-vendored.workspace = true

[dev-dependencies]
# fuzzing (property tests; the libFuzzer targets are in client/fuzz)
proptest = "1"
# self dev-dependency: the integration tests see the `testkit` fixtures (FakeVault)
pool-proto = { path = ".", features = ["testkit"] }
